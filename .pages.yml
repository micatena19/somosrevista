media:
  - name: imagenes
    label: Imágenes
    input: images
    output: /somosrevista/images
    categories: [image]
  - name: pdfs
    label: Ediciones en PDF
    input: pdf
    output: /somosrevista/pdf
    categories: [document]

content:
  - name: ediciones
    label: Ediciones y sus notas
    type: file
    path: data/ediciones.json
    format: json
    list: true
    fields:
      - name: numero
        label: Número (ej. 03)
        type: string
      - name: fecha
        label: Mes y año (ej. Octubre 2026)
        type: string
      - name: portada
        label: Portada (cualquier tamaño)
        type: image
        options:
          media: imagenes
      - name: archivo
        label: PDF de la revista completa (opcional)
        type: file
        options:
          media: pdfs
      - name: enlace
        label: O link externo de la revista (opcional)
        type: string
      - name: notas
        label: Notas de esta edición
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: categoria
            label: Categoría (ej. Comunidad)
            type: string
          - name: imagen
            label: Foto (cualquier tamaño)
            type: image
            options:
              media: imagenes
          - name: texto
            label: Texto de la nota (dejá una línea en blanco entre párrafos)
            type: text
