media:
  - name: imagenes
    label: Imágenes
    input: images
    output: /somosrevista/images
    categories: [image]
  - name: pdfs
    label: Ediciones en PDF
    input: pdf
    output: /somosrevista/pdf
    categories: [document]

content:
  - name: ediciones
    label: Ediciones y sus notas
    type: file
    path: data/ediciones.json
    format: json
    list: true
    fields:
      - name: numero
        label: Número (ej. 03)
        type: string
      - name: fecha
        label: Mes y año (ej. Octubre 2026)
        type: string
      - name: portada
        label: Portada (cualquier tamaño)
        type: image
        options:
          media: imagenes
      - name: archivo
        label: PDF de la revista completa (opcional)
        type: file
        options:
          media: pdfs
      - name: enlace
        label: O link externo de la revista (opcional)
        type: string
      - name: notas
        label: Notas de esta edición
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: subtitulo
            label: Subtítulo (opcional, va debajo del título)
            type: string
          - name: categoria
            label: Categoría (ej. Comunidad)
            type: string
          - name: imagen
            label: Foto (cualquier tamaño)
            type: image
            options:
              media: imagenes
          - name: texto
            label: Texto de la nota (línea en blanco entre párrafos. ## subtítulo, > cita, - lista, [foto 1] para poner una foto)
            type: text
          - name: fotos
            label: Fotos dentro de la nota (la 1ª es [foto 1], la 2ª [foto 2]...)
            type: object
            list: true
            fields:
              - name: imagen
                label: Foto
                type: image
                options:
                  media: imagenes
              - name: pie
                label: Pie de foto (opcional)
                type: string

  - name: portada
    label: Fotos del inicio (carrusel)
    type: file
    path: data/portada.json
    format: json
    list: true
    fields:
      - name: imagen
        label: Foto (conviene que sea horizontal)
        type: image
        options:
          media: imagenes
      - name: descripcion
        label: Descripción corta (para accesibilidad y Google)
        type: string

  - name: anuncios
    label: Anuncios (ventana emergente)
    type: file
    path: data/anuncios.json
    format: json
    list: true
    fields:
      - name: activo
        label: Mostrar este anuncio en el sitio
        type: boolean
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto (opcional)
        type: text
      - name: imagen
        label: Imagen o afiche (cualquier tamaño)
        type: image
        options:
          media: imagenes
      - name: boton
        label: Texto del botón (ej. Más información)
        type: string
      - name: enlace
        label: Link del botón (ej. WhatsApp o web del anunciante)
        type: string
      - name: hasta
        label: Mostrar hasta el día (opcional, después se oculta solo)
        type: date
